<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio Presigned URL</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5f6b7a;
      --border: #d5dae1; --accent: #1f6feb; --accent-text: #ffffff;
      --error-bg: #fdecec; --error: #b42318; --ok-bg: #eaf5ee; --ok: #1a7f37;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1216; --card: #171b21; --text: #e6e9ee; --muted: #9aa5b4;
        --border: #2c333d; --accent: #4c8dff; --accent-text: #0b0d10;
        --error-bg: #3a1716; --error: #ff9b93; --ok-bg: #11291a; --ok: #6fdc8c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { max-width: 560px; margin: 48px auto; padding: 0 16px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 24px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
    label { display: block; font-weight: 600; margin: 0 0 6px; }
    .field { margin-bottom: 16px; }
    .row { display: flex; gap: 12px; }
    .row .field { flex: 1; }
    select, input {
      width: 100%; padding: 9px 10px; font: inherit; color: var(--text);
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    }
    .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
    button {
      font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 6px; cursor: pointer;
      border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text);
    }
    button.secondary { background: transparent; color: var(--accent); }
    button:disabled { opacity: .5; cursor: default; }
    .msg { margin-top: 16px; padding: 10px 12px; border-radius: 6px; display: none; word-break: break-word; }
    .msg.error { display: block; background: var(--error-bg); color: var(--error); }
    .result { margin-top: 16px; display: none; }
    .result textarea {
      width: 100%; height: 96px; padding: 8px; font: 12px/1.4 ui-monospace, Menlo, monospace;
      color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; resize: vertical;
    }
    .actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
    .countdown { color: var(--ok); font-size: 13px; }
    .countdown.expired { color: var(--error); }
  </style>
</head>
<body>
<main>
  <h1>SageMaker AI Studio presigned URL</h1>
  <p class="sub">Pick a domain, enter a user profile, and get a one-time login link.</p>

  <form class="card" id="form">
    <div class="field">
      <label for="domain">Domain</label>
      <select id="domain" required><option value="">Loading domains…</option></select>
    </div>

    <div class="field">
      <label for="profile">User profile name</label>
      <input id="profile" list="profiles" autocomplete="off" required placeholder="e.g. data-scientist-1">
      <datalist id="profiles"></datalist>
      <div class="hint" id="profileHint"></div>
    </div>

    <div class="row">
      <div class="field">
        <label for="session">Session length (hours)</label>
        <input id="session" type="number" min="0.5" max="12" step="0.5" value="12">
      </div>
      <div class="field">
        <label for="expires">Link valid for (seconds)</label>
        <input id="expires" type="number" min="5" max="300" value="300">
      </div>
    </div>

    <button type="submit" id="submit">Generate URL</button>
    <div class="msg" id="msg"></div>

    <div class="result" id="result">
      <label for="url">Presigned URL</label>
      <textarea id="url" readonly></textarea>
      <div class="actions">
        <button type="button" id="open">Open Studio</button>
        <button type="button" class="secondary" id="copy">Copy</button>
        <span class="countdown" id="countdown"></span>
      </div>
    </div>
  </form>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  let timer;

  async function api(path, options) {
    const res = await fetch(path, options);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
    return data;
  }

  function showError(text) {
    $("msg").textContent = text;
    $("msg").className = text ? "msg error" : "msg";
  }

  async function loadDomains() {
    try {
      const { domains } = await api("/api/domains");
      const sel = $("domain");
      sel.innerHTML = domains.length
        ? '<option value="">Select a domain…</option>'
        : '<option value="">No domains found in this region</option>';
      for (const d of domains) {
        const opt = document.createElement("option");
        opt.value = d.id;
        opt.textContent = `${d.name} (${d.id})${d.status === "InService" ? "" : " — " + d.status}`;
        sel.appendChild(opt);
      }
      if (domains.length === 1) { sel.value = domains[0].id; loadProfiles(); }
    } catch (e) {
      $("domain").innerHTML = '<option value="">Could not load domains</option>';
      showError(e.message);
    }
  }

  async function loadProfiles() {
    const domainId = $("domain").value;
    $("profiles").innerHTML = "";
    $("profileHint").textContent = "";
    if (!domainId) return;
    try {
      const { userProfiles } = await api(`/api/user-profiles?domainId=${encodeURIComponent(domainId)}`);
      for (const name of userProfiles) {
        const opt = document.createElement("option");
        opt.value = name;
        $("profiles").appendChild(opt);
      }
      $("profileHint").textContent = userProfiles.length
        ? `Existing profiles: ${userProfiles.join(", ")}`
        : "This domain has no user profiles yet.";
    } catch (e) {
      $("profileHint").textContent = "Could not load profiles: " + e.message;
    }
  }

  function startCountdown(seconds) {
    clearInterval(timer);
    const end = Date.now() + seconds * 1000;
    const tick = () => {
      const left = Math.max(0, Math.round((end - Date.now()) / 1000));
      $("countdown").textContent = left ? `Link expires in ${left}s` : "Link expired — generate a new one";
      $("countdown").className = left ? "countdown" : "countdown expired";
      $("open").disabled = !left;
      if (!left) clearInterval(timer);
    };
    tick();
    timer = setInterval(tick, 1000);
  }

  $("domain").addEventListener("change", loadProfiles);

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    showError("");
    $("result").style.display = "none";
    $("submit").disabled = true;
    try {
      const data = await api("/api/presigned-url", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          domainId: $("domain").value,
          userProfileName: $("profile").value.trim(),
          sessionExpirationSeconds: Math.round(Number($("session").value) * 3600),
          expiresInSeconds: Number($("expires").value),
        }),
      });
      $("url").value = data.url;
      $("result").style.display = "block";
      startCountdown(data.expiresInSeconds);
    } catch (err) {
      showError(err.message);
    } finally {
      $("submit").disabled = false;
    }
  });

  $("open").addEventListener("click", () => window.open($("url").value, "_blank", "noopener"));
  $("copy").addEventListener("click", async () => {
    await navigator.clipboard.writeText($("url").value);
    $("copy").textContent = "Copied";
    setTimeout(() => ($("copy").textContent = "Copy"), 1500);
  });

  loadDomains();
</script>
</body>
</html>
